# set $TERM for 256 color support
# https://github.com/tmux/tmux/issues/1246
# "tmux-256color" is not available on Ubuntu 20.04
# if-shell '[[ -r ${PREFIX:-/usr}/share/terminfo/t/tmux-256color ]]' {
#   set -g default-terminal "tmux-256color"
# } {
#   set -g default-terminal "screen-256color"
# }

# Check if tmux version is at least 3.2 (requires tmux 3.2 ;))
# %if #{>=:#{version},3.2}
# display-message "3.2 is installed"
# %else
# display-message "Current tmux version < 3.2"
# %endif

# NOTE Do we even need to force these features?
# tmux 3.2+
set -sa terminal-features ",*wezterm*:RGB:clipboard:mouse:osc7:sixel"
set -sa terminal-features ",*256color*:RGB:clipboard"
set -sa terminal-features ",*foot*:Tc:clipboard:extkeys:sixel"
# osc8 support
# See https://github.com/Alhadis/OSC8-Adoption
set -sa terminal-features ",*:hyperlinks"

set -g allow-passthrough on  # required for CLI image preview tools
# FIXME Below doesn't work, we end up with:
# TERM=wezterm TERM_PROGRAM=tmux TERM_PROGRAM_VERSION=3.3a
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -ga update-environment TERM_PROGRAM_VERSION
# set -g default-terminal "foot"
run-shell "#{d:current_file}/bin/default-term.sh"

# Extended keys
# https://github.com/tmux/tmux/wiki/Modifier-Keys#extended-keys=
set -s extended-keys on

source -F "#{d:current_file}/env.conf"

# Do not let non-interactive launchers disable TUI colors.
set-environment -gu NO_COLOR

# NVIM recommandation
# https://github.com/neovim/neovim/wiki/FAQ#esc-in-tmux-or-gnu-screen-is-delayed
set -sg escape-time 10

# show message on alert (visual bell)
set -g visual-activity on

# Show seconds in the clock (<Prefix>-t)
set -g clock-mode-style 24-with-seconds

# Prevent sourcing of /etc/profile which messes up $PATH
# set -g default-shell $(command -v zsh)

source -F "#{TMUX_CONFIG_HOME}/styles.conf"
# Source termux-specific config
%if #{!=:#{TERMUX_VERSION},} source -F "#{TMUX_CONFIG_HOME}/termux.conf" %endif
# Host-local additions written by Home Manager, if any
source -q -F "#{TMUX_CONFIG_HOME}/local.conf"

# statusbar properties
set -g status-interval 1

set -g status-left-length 80
set -g status-right-length 80

set -g status-left "#(#{TMUX_BIN_HOME}/tmux-status.sh --left #S)"
set -g status-right "#{prefix_highlight} #{load1} · %H:%M:%S "
set -g window-status-format "#I #(#{TMUX_BIN_HOME}/tmux-window-icon.sh #{pane_current_command}) #W" # window number,program name,active (or not)
set -g window-status-current-format " #I #(#{TMUX_BIN_HOME}/tmux-window-icon.sh #{pane_current_command}) #W #{?window_zoomed_flag,🔍 ,}"

set -g history-limit 10000

# Required for https://github.com/roxma/vim-tmux-clipboard
# Also set by tmux-sensible
set -g focus-events on

# Amount of time to show messages for
set -g display-time 500

# try setting correct win-title
set -g set-titles on

# set window title string
# format: tmux[:SESSION]@HOST [- CMD]
# SESSION is not display if == main
# CMD is not displayed if == zsh
set -g set-titles-string \
  "tmux#{?#{==:#{session_name},main},,:#{session_name}}@#{?#{==:#{HOST},},#h,#{HOST}} #{?#{==:#W,zsh},,- #W}"

# Automatically set window title
setw -g automatic-rename on

# Auto renumerate windows when closing one
set -g renumber-windows on

# resize a window based on the smallest client actually viewing it, not on
# the smallest one attached to the entire session
setw -g aggressive-resize on

# mouse support
# hint: to copy/paste|select using mouse hold Shift + click2|scroll
set -g mouse on

# https://github.com/tmux/tmux/wiki/Clipboard
set -g set-clipboard on

# copy-command: tmux 3.2+
set -g copy-command "xcp"

# Copy mode. Copy selection to clipboard after pressing Enter or y
# bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xcp"
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xcp"
# Y to stay in copy mode
# bind -T copy-mode-vi Y send-keys -X copy-pipe "xcp"
# Mouse selection -> copy to clipboard
# bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "xcp"

source -F "#{TMUX_CONFIG_HOME}/keys.conf"
source -F "#{TMUX_CONFIG_HOME}/plugins.conf"

