# https://stackoverflow.com/a/55843777/1872036

# Set TMPDIR
%if #{==:#{TMPDIR},}
TMPDIR=/tmp
%else
TMPDIR="$TMPDIR"
%endif
setenv -gF TMPDIR "#{TMPDIR}"

# Set XDG_CACHE_HOME
%if #{==:#{XDG_CACHE_HOME},}
XDG_CACHE_HOME=$HOME/.cache
%else
XDG_CACHE_HOME="$XDG_CACHE_HOME"
%endif
setenv -gF XDG_CACHE_HOME "#{XDG_CACHE_HOME}"

# Set XDG_CONFIG_HOME
%if #{==:#{XDG_CONFIG_HOME},}
XDG_CONFIG_HOME=$HOME/.config
%else
XDG_CONFIG_HOME="$XDG_CONFIG_HOME"
%endif
setenv -gF XDG_CONFIG_HOME "#{XDG_CONFIG_HOME}"

# Set XDG_DATA_HOME
%if #{==:#{XDG_DATA_HOME},}
XDG_DATA_HOME=$HOME/.local/share
%else
XDG_DATA_HOME="$XDG_DATA_HOME"
%endif
setenv -gF XDG_DATA_HOME "#{XDG_DATA_HOME}"

# Set custom variables
TMUX_CONFIG_HOME="$XDG_CONFIG_HOME/tmux"
TMUX_BIN_HOME="$TMUX_CONFIG_HOME/bin"
TMUX_PLUGIN_MANAGER_PATH="$XDG_DATA_HOME/tpm"

setenv -gF TMUX_CONFIG_HOME "#{TMUX_CONFIG_HOME}"
setenv -gF TMUX_BIN_HOME "#{TMUX_BIN_HOME}"
setenv -gF TMUX_PLUGIN_MANAGER_PATH "#{TMUX_PLUGIN_MANAGER_PATH}"

# Set tmux version
# run-shell "$TMUX_BIN_HOME/tmux-version.sh export #{version}"
# tmux 3.2+
setenv -gF TMUX_VERSION '#{version}'

# We *always* want completions in tmux sessions
setenv -gr NO_COMPLETIONS

