%hidden STYLE_FG="#4c4d4e"
%hidden STYLE_BG="terminal"

%hidden STYLE_WINDOW_CURRENT_FG="#72c03d"
%hidden STYLE_WINDOW_CURRENT_BG="terminal"

%hidden STYLE_PANE_BORDER_FG="#4c4d4e"
%hidden STYLE_ACTIVE_PANE_BORDER_FG="#72c03d"

%hidden STYLE_MSG_FG="white"
%hidden STYLE_MSG_BG="#f54263"

%hidden STYLE_DEFAULT_FG="fg=${STYLE_FG}"
%hidden STYLE_DEFAULT_BG="bg=${STYLE_BG}"
%hidden STYLE_DEFAULT="${STYLE_DEFAULT_FG},${STYLE_DEFAULT_BG}"
%hidden STYLE_FMT_DEFAULT="#[${STYLE_DEFAULT}]"
%hidden STYLE_FMT_DEFAULT_FG="#[${STYLE_DEFAULT_FG}]"
%hidden STYLE_FMT_DEFAULT_BG="#[${STYLE_DEFAULT_BG}]"

# Default foreground color
set -gF status-fg "#{STYLE_FG}"

# status line color
set -gF status-style "${STYLE_DEFAULT},push-default"
# set -gF status-left-style  "fg=#{STYLE_FG},bg=#{STYLE_BG},align=left"
# set -gF status-right-style "fg=#{STYLE_FG},bg=#{STYLE_BG},align=right"
set -gF window-status-current-style "fg=#{STYLE_WINDOW_CURRENT_FG},bg=#{STYLE_BG}"

# pane border color
set -g pane-active-border-style 'fg=#{STYLE_ACTIVE_PANE_BORDER_FG}'
set -g pane-border-indicators both # arrows + colour
set -g pane-border-lines single
set -g pane-border-style 'fg=#{STYLE_PANE_BORDER_FG}'
# tmux 3.7c can underflow clipped pane-title widths with differently sized
# clients, stalling the server in tty_draw_line. Keep titles off for now.
set-hook -gu window-layout-changed
set -g pane-border-status off
set -g pane-border-format '#{pane_index} #{pane_title}'

# command/message line colors
set -gF message-style "fg=#{STYLE_MSG_FG},bg=#{STYLE_MSG_BG},bold"

