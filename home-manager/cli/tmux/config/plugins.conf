# Plugins are installed and loaded by Home Manager (home-manager/cli/tmux),
# in the order of the former @tpm_plugins list: see plugins-nix.conf.

# tmux-prefix-highlight
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_show_sync_mode 'on'
set -g @prefix_highlight_prefix_prompt '^A'
set -g @prefix_highlight_copy_prompt 'COPY'
set -g @prefix_highlight_sync_prompt 'SYNC'

# load average
# set -g @load_per_cpu_core "true"

# pain-control
# set -g @pane_resize "10"
set -g @disabled_keys "|,c"

# ssh-split
set -g @ssh-split-strip-cmd "true"
set -g @ssh-split-keep-cwd "true"
set -g @ssh-split-keep-remote-cwd "true"
set -g @ssh-split-no-env "true"
set -g @ssh-split-verbose "true"
set -g @ssh-split-debug "true"
set -g @ssh-split-ignore-programs "claude claude-work codex agy gemini opencode copilot"
set -g @ssh-split-h-key "|"
set -g @ssh-split-v-key "S"
set -g @ssh-split-w-key "C"

# tmux-forsaken
set -g @forsaken-kill-empty-panes-key "ä"
set -g @forsaken-kill-empty-panes-confirm true
set -g @forsaken-kill-windows-ttr-key "W"
set -g @forsaken-kill-windows-ttr-confirm true
set -g @forsaken-kill-other-panes-key "ö"
set -g @forsaken-kill-other-panes-confirm true

# tmux-thumbs
set -g @thumbs-key F
set -g @thumbs-unique 1
set -g @thumbs-position right
set -g @thumbs-bg-color blue
set -g @thumbs-fg-color red
set -g @thumbs-contrast 1
set -g @thumbs-select-fg-color red
set -g @thumbs-osc52 1

# rerespawn
set -g @rerespawn-wrap "true"
set -g @rerespawn-key "N"

# extrakto
set -g @extrakto_key "E"

# fuzzback
set -g @fuzzback-popup 1
set -g @fuzzback-popup-size '90%'
set -g @fuzzback-finder-bind 'ctrl-y:execute-silent(echo -n {3..} | xcp)+abort'

# Load the plugins (keep this line at the very bottom)
source -F "#{TMUX_CONFIG_HOME}/plugins-nix.conf"

