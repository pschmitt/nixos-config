# Enable extended keys (tmux 3.2+)
# https://github.com/tmux/tmux/wiki/Modifier-Keys#extended-keys
set -s extended-keys on

# set vi keys
setw -g mode-keys vi

unbind [
bind Escape copy-mode

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi \
  K send-keys -X previous-prompt -o \; display-message "Previous prompt"
bind -T copy-mode-vi \
  J send-keys -X next-prompt -o \; display-message "Next prompt"

unbind p
bind p paste-buffer

# r Reload config
bind r source-file $TMUX_CONFIG_HOME/tmux.conf \; \
  display-message "tmux config reloaded"

# Set the prefix to ^A.
unbind C-b
set -g prefix ^A
# set -g prefix2 C-b

# Prefix+Ctrl-y or Prefix+a to send prefix to underlying window
# https://stackoverflow.com/q/8518815
bind -n C-y send-prefix
bind a send-prefix

# Kill pane
unbind x
bind x kill-pane

# New window
unbind c
bind c new-window

# New window in PWD
# NOTE This is set by tmux-ssh-split (see plugins.conf)
# unbind C
# bind C neww -c "#{pane_current_path}"

# New window in TMPDIR
bind T new-window -n tmp -c "${TMPDIR}"

# Detach from current session
unbind ^D
bind ^D detach

# Display connected clients
unbind *
bind * list-clients

# Focus next window
unbind " "
bind " " next-window

# Rename current window
unbind A
bind A command-prompt "rename-window %%"

# Rename current pane
unbind a
bind a command-prompt -p "Rename pane:" "select-pane -T %%"

# Focus on last focussed window
unbind ^A
bind ^A last-window

# Focus on *previous* window
unbind BSpace
bind BSpace previous-window

# Display window list
unbind ^W
bind ^W list-windows

# Kill tmux server
unbind Q
bind Q confirm-before "kill-server"

# Kill current window
unbind w
# NOTE unlink-window -k is "better" than kill-window
#   -> https://github.com/sainnhe/tmux-fzf#link--move-window
bind w confirm-before -p "Kill window? (y|n)" "unlink-window -k"

# Refresh screen
unbind ^L
bind ^L refresh-client

# Select next/previous pane
unbind Tab
bind Tab select-pane -t:.+
unbind BTab
bind BTab select-pane -t:.-

# Select a window with a live preview
unbind b
bind-key b display-popup -w 90% -h 90% -E "$TMUX_BIN_HOME/tmux-window-picker.sh"

# Break pane into a new window
unbind B
bind-key B break-pane

# Respawn current pane
# unbind N
# # bind N respawn-pane -k
# bind N run -b '/home/pschmitt/.local/share/tpm/tmux-rerespawn/scripts/respawn.sh -w'

# Switch to main session
unbind M
bind M switch-client -t main

# Display system debug info
unbind X
# FIXME This creates a window which exits just after launching xpanes
# The alternative would be to use "xpanes -x" but this will desync the panes...
# https://github.com/greymd/tmux-xpanes/blob/8f80663117b7608c494141c544e4541dd380d82f/bin/xpanes#L1810-L1823
bind X neww -d '$TMUX_BIN_HOME/xpanes.sh system'

# Paste GPG password
unbind g
bind g run -b "$TMUX_BIN_HOME/tmux-pswd-buffer-paste.sh gpg"

# Put GPG password in the clipboard
unbind G
bind G neww -n pswd_gpg "zhj bww -c -n gpg"

# Move current pane up
unbind Enter
bind Enter rotate-window -U \; select-pane -l

unbind Space
bind Space next-layout

# Fix Home/End keys in nvim
# https://github.com/neovim/neovim/issues/6134
bind-key -n Home send Escape "OH"
bind-key -n End send Escape "OF"

# Move current pane with Shift+Arrow keys
# https://stackoverflow.com/a/70024796
unbind S-Up
unbind S-Down
unbind S-Left
unbind S-Right
bind S-Up swap-pane -d -t '.{up-of}'
bind S-Down swap-pane -d -t '.{down-of}'
bind S-Left swap-pane -d -t '.{left-of}'
bind S-Right swap-pane -d -t '.{right-of}'

