# Custom OSD toast, triggered via CLI/IPC — the Noctalia counterpart to
# pkgs/local/dms-shell-critical-notifications' DMS toast IPC. Noctalia has no
# generic "show an arbitrary OSD" primitive of its own (only fixed-purpose
# ones: brightness-osd, volume-osd, mic-volume-osd, keyboard-backlight-osd),
# so this plugin provides one, matching pkgs/local/osd's feature set:
# severity, category (informational dedupe key), a click-to-run command, and
# an auto-dismiss timeout.
#
# Usage:
#   noctalia msg panel-open pschmitt/osd:toast '{"summary":"Feierabend","body":"23 minutes left","severity":"info","timeout_ms":4000}'
#   noctalia msg panel-open pschmitt/osd:compact '{"summary":"Feierabend"}'
#   noctalia msg panel-close pschmitt/osd:toast
#   noctalia msg plugin pschmitt/osd:toast all dismiss <category>

id = "pschmitt/osd"
name = "Custom OSD"
version = "1.6.0"
plugin_api = 14
author = "pschmitt"
license = "MIT"
tags = ["panel", "utility", "notifications"]
icon = "bell"
description = "Ad-hoc on-screen toast, triggered via CLI/IPC with a JSON payload (summary, body, severity, category, command, timeout_ms)."

[[setting]]
key = "default_timeout_ms"
type = "int"
label_key = "settings.default_timeout_ms.label"
description_key = "settings.default_timeout_ms.description"
default = 4000
min = 500
max = 60000

[[setting]]
key = "show_icon"
type = "bool"
label_key = "settings.show_icon.label"
description_key = "settings.show_icon.description"
default = true

# Sized/styled to match noctalia's own built-in OSDs (brightness-osd,
# volume-osd, …): upstream's horizontal card is 252x46px at ui_scale=1 and
# its surface 252x62px — see cardWidth()/cardHeight()/osdSurfaceHeight() in
# src/shell/osd/osd_overlay.cpp. The [[panel]] geometry below adopts exactly
# those numbers. Note the panel host already insets the script's tree by
# Style::panelPadding (14px per side, not configurable from a plugin), so the
# content box is 224x34px — just enough for the second (body) line a native
# OSD never carries, with no dead space left over.
[[setting]]
key = "icon_size"
type = "int"
label_key = "settings.icon_size.label"
description_key = "settings.icon_size.description"
default = 20
min = 12
max = 32

[[setting]]
key = "icon_text_gap"
type = "int"
label_key = "settings.icon_text_gap.label"
description_key = "settings.icon_text_gap.description"
default = 10
min = 0
max = 32
advanced = true

[[setting]]
key = "line_gap"
type = "int"
label_key = "settings.line_gap.label"
description_key = "settings.line_gap.description"
default = 2
min = 0
max = 16
advanced = true

[[setting]]
key = "content_padding_h"
type = "int"
label_key = "settings.content_padding_h.label"
description_key = "settings.content_padding_h.description"
default = 0
min = 0
max = 24
advanced = true

[[setting]]
key = "content_padding_v"
type = "int"
label_key = "settings.content_padding_v.label"
description_key = "settings.content_padding_v.description"
default = 0
min = 0
max = 12
advanced = true

[[setting]]
key = "max_text_width"
type = "int"
label_key = "settings.max_text_width.label"
description_key = "settings.max_text_width.description"
default = 190
min = 80
max = 194
advanced = true

[[setting]]
key = "summary_font_size"
type = "int"
label_key = "settings.summary_font_size.label"
description_key = "settings.summary_font_size.description"
default = 14
min = 10
max = 24

[[setting]]
key = "summary_font_weight"
type = "select"
label_key = "settings.summary_font_weight.label"
description_key = "settings.summary_font_weight.description"
default = "bold"
options = [
  { value = "normal", label_key = "settings.font_weight.normal" },
  { value = "medium", label_key = "settings.font_weight.medium" },
  { value = "semibold", label_key = "settings.font_weight.semibold" },
  { value = "bold", label_key = "settings.font_weight.bold" },
]

[[setting]]
key = "summary_color"
type = "color"
label_key = "settings.summary_color.label"
description_key = "settings.summary_color.description"
default = "on_surface"

[[setting]]
key = "body_font_size"
type = "int"
label_key = "settings.body_font_size.label"
description_key = "settings.body_font_size.description"
default = 12
min = 9
max = 20

[[setting]]
key = "body_color"
type = "color"
label_key = "settings.body_color.label"
description_key = "settings.body_color.description"
default = "on_surface_variant"

[[setting]]
key = "text_align"
type = "select"
label_key = "settings.text_align.label"
description_key = "settings.text_align.description"
default = "start"
options = [
  { value = "start", label_key = "settings.text_align.start" },
  { value = "center", label_key = "settings.text_align.center" },
  { value = "end", label_key = "settings.text_align.end" },
]

[[setting]]
key = "two_line_balance"
type = "int"
label_key = "settings.two_line_balance.label"
description_key = "settings.two_line_balance.description"
default = 2
min = 0
max = 12
advanced = true

[[setting]]
key = "info_icon"
type = "glyph"
label_key = "settings.info_icon.label"
description_key = "settings.info_icon.description"
default = "info-circle"

[[setting]]
key = "info_icon_color"
type = "color"
label_key = "settings.info_icon_color.label"
description_key = "settings.info_icon_color.description"
default = "on_surface"

[[setting]]
key = "warn_icon"
type = "glyph"
label_key = "settings.warn_icon.label"
description_key = "settings.warn_icon.description"
default = "alert-triangle"

[[setting]]
key = "warn_icon_color"
type = "color"
label_key = "settings.warn_icon_color.label"
description_key = "settings.warn_icon_color.description"
default = "secondary"

[[setting]]
key = "error_icon"
type = "glyph"
label_key = "settings.error_icon.label"
description_key = "settings.error_icon.description"
default = "alert-circle"

[[setting]]
key = "error_icon_color"
type = "color"
label_key = "settings.error_icon_color.label"
description_key = "settings.error_icon_color.description"
default = "error"

[[setting]]
key = "content_fill"
type = "color"
label_key = "settings.content_fill.label"
description_key = "settings.content_fill.description"
default = "surface/0"
advanced = true

[[setting]]
key = "content_border"
type = "color"
label_key = "settings.content_border.label"
description_key = "settings.content_border.description"
default = "outline/0"
advanced = true

[[setting]]
key = "content_border_width"
type = "int"
label_key = "settings.content_border_width.label"
description_key = "settings.content_border_width.description"
default = 0
min = 0
max = 8
advanced = true

[[setting]]
key = "content_radius"
type = "int"
label_key = "settings.content_radius.label"
description_key = "settings.content_radius.description"
default = 0
min = 0
max = 32
advanced = true

[[setting]]
key = "profile_rules"
type = "string"
label_key = "settings.profile_rules.label"
description_key = "settings.profile_rules.description"
default = '''[{"match":{"category":"success"},"style":{"icon":"circle-check","icon_color":"#A8D38D"}},{"match":{"category":"warning"},"style":{"icon":"alert-triangle","icon_color":"#F3BD6A"}},{"match":{"category":["error","failure"]},"style":{"icon":"alert-circle","icon_color":"#F1705F"}},{"name":"critical","style":{"icon":"alert-circle","icon_color":"error","summary_color":"error","timeout_ms":0}}]'''
advanced = true

# Two panel entries, because panel geometry is static per entry (no runtime
# resize API) while a toast is one or two lines depending on its payload. One
# entry sized for both would leave the common single-line toast floating in
# dead space, which is exactly what the native OSDs never do. Callers pick:
# ":compact" without a body, ":toast" with one — see pkgs/local/osd/osd.sh.
# Both run this same script; each panel entry gets its own Luau instance and
# they share the plugin-level settings above.
#
# The heights are host-padding-bound, not text-bound: the panel host insets
# the script tree by Style::panelPadding (14px per side, not overridable from
# a plugin), so a 20px icon already needs 48px of panel to fit. A native OSD
# gets a 46px card out of the same glyph because its own cardPadding is
# spaceMd (12px) — hence 48 rather than 46 for the single-line entry.
[[panel]]
id = "compact"
entry = "panel.luau"
# 252px is upstream's cardWidth() for a horizontal OSD; 48px is the smallest
# height that clears the icon inside the host padding. Content box: 224x20.
width = 252
height = 48
placement = "floating"
position = "top_center"
open_near_click = false
# A passive toast should never steal keyboard focus (matches the native
# OSDs' LayerShellKeyboard::None) or block clicks on whatever's underneath.
# keyboard_focus = "none" requires dismiss_on_outside_click = false — no
# loss here since the toast already dismisses itself (timer / dismiss IPC).
keyboard_focus = "none"
dismiss_on_outside_click = false

[[panel]]
id = "toast"
entry = "panel.luau"
# One line taller than "compact" for the body line. Content box: 224x34,
# which fits summary (14px) + line_gap + body (12px) + two_line_balance.
width = 252
height = 62
placement = "floating"
position = "top_center"
open_near_click = false
keyboard_focus = "none"
dismiss_on_outside_click = false
