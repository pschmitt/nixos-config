# Fork of rylos/syncthing (noctalia-dev/community-plugins, by Marco Ziliani,
# itself a port of the v4 syncthing-status plugin by Pir0c0pter0), for two
# bar-widget changes: a bigger, tray-icon-sized logo, and the DMS syncshell
# widget's composited status badges (pkgs/local/syncshell-dank-widget/assets)
# instead of a separate small glyph next to the logo. Everything else
# (service/panel/desktop/launcher/shortcut) is unchanged upstream.

id = "pschmitt/syncthing"
name = "Syncthing"
version = "2.3.3"
plugin_api = 15 # noctalia.openSettings(), for the panel's settings button
author = "pschmitt (fork of Marco Ziliani's rylos/syncthing)"
license = "MIT"
dependencies = ["syncthing", "gio", "xdg-open"]
tags = ["bar", "panel", "service", "network", "utility", "indicator"]
icon = "cloud-network"
description = "Syncthing status and control: bar widget, detail panel with per-folder pause/rescan, and a global pause shortcut."

# ── Plugin-level settings (shared by every entry, edited in Settings → Plugins) ──

[[setting]]
key = "url"
type = "string"
label_key = "settings.url.label"
description_key = "settings.url.description"
default = ""

[[setting]]
key = "api_key"
type = "string"
label_key = "settings.api_key.label"
description_key = "settings.api_key.description"
default = ""

[[setting]]
key = "config_path"
type = "file"
label_key = "settings.config_path.label"
description_key = "settings.config_path.description"
default = ""
advanced = true

[[setting]]
key = "poll_interval"
type = "int"
label_key = "settings.poll_interval.label"
description_key = "settings.poll_interval.description"
default = 10
min = 2
max = 300

[[setting]]
key = "folders"
type = "string_list"
label_key = "settings.folders.label"
description_key = "settings.folders.description"
default = []
advanced = true

[[setting]]
key = "idle_color"
type = "color"
label_key = "settings.idle_color.label"
description_key = "settings.idle_color.description"
default = "primary"

[[setting]]
key = "syncing_color"
type = "color"
label_key = "settings.syncing_color.label"
description_key = "settings.syncing_color.description"
default = "secondary"

[[setting]]
key = "paused_color"
type = "color"
label_key = "settings.paused_color.label"
description_key = "settings.paused_color.description"
default = "outline"

[[setting]]
key = "disconnected_color"
type = "color"
label_key = "settings.disconnected_color.label"
description_key = "settings.disconnected_color.description"
default = "secondary"

[[setting]]
key = "offline_color"
type = "color"
label_key = "settings.offline_color.label"
description_key = "settings.offline_color.description"
default = "error"

[[setting]]
key = "unauthorized_color"
type = "color"
label_key = "settings.unauthorized_color.label"
description_key = "settings.unauthorized_color.description"
default = "error"

[[setting]]
key = "error_color"
type = "color"
label_key = "settings.error_color.label"
description_key = "settings.error_color.description"
default = "error"

[[setting]]
key = "unconfigured_color"
type = "color"
label_key = "settings.unconfigured_color.label"
description_key = "settings.unconfigured_color.description"
default = "outline"

[[setting]]
key = "notify_events"
type = "bool"
label_key = "settings.notify_events.label"
description_key = "settings.notify_events.description"
default = true

[[setting]]
key = "notify_folder_up_to_date"
type = "bool"
label_key = "settings.notify_folder_up_to_date.label"
description_key = "settings.notify_folder_up_to_date.description"
default = true

[[setting]]
key = "notify_folder_error"
type = "bool"
label_key = "settings.notify_folder_error.label"
description_key = "settings.notify_folder_error.description"
default = true

[[setting]]
key = "notify_device_connected"
type = "bool"
label_key = "settings.notify_device_connected.label"
description_key = "settings.notify_device_connected.description"
default = true

[[setting]]
key = "notify_device_disconnected"
type = "bool"
label_key = "settings.notify_device_disconnected.label"
description_key = "settings.notify_device_disconnected.description"
default = true

[[setting]]
key = "insecure_tls"
type = "bool"
label_key = "settings.insecure_tls.label"
description_key = "settings.insecure_tls.description"
default = false
advanced = true

# ── Entries ──────────────────────────────────────────────────────────────────

[[service]]
id = "poller"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "bar.luau"

  [[widget.setting]]
  key = "show_pending"
  type = "bool"
  label_key = "settings.show_pending.label"
  description_key = "settings.show_pending.description"
  default = true

  [[widget.setting]]
  key = "icon_size"
  type = "int"
  label_key = "settings.icon_size.label"
  description_key = "settings.icon_size.description"
  default = 16
  min = 12
  max = 48

  # Routed through the anchored panel-toggle dispatcher (same one native bar
  # widgets use) so the panel opens under the click instead of centered on
  # the bar — noctalia.togglePanel() always opens unanchored.
  [widget.actions]
  left = "panel-toggle pschmitt/syncthing:panel"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 400
height = 500
placement = "attached"
position = "auto"
open_near_click = true

[[shortcut]]
id = "pause"
entry = "shortcut.luau"

[[launcher_provider]]
id = "folders"
entry = "launcher.luau"
prefix = "st"
glyph = "cloud-network"
include_in_global_search = false

[[desktop_widget]]
id = "desktop"
entry = "desktop.luau"
