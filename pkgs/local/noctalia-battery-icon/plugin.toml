id = "pschmitt/battery-icon"
name = "Battery Icon"
version = "0.1.0"
plugin_api = 26 # noctalia.getSetting(), needed to resolve palette-role color values
author = "pschmitt"
license = "GPL-3.0-only"
tags = ["bar", "system", "hardware"]
icon = "battery-2"
description = "Battery percentage rendered inside the battery icon itself (Android status-bar style), via a live-generated bitmap — the bar-widget UI framework has no overlay/z-stack primitive for drawing text on top of a shape."
# magick renders the icon bitmap; udevadm gives instant plug/unplug
# detection instead of waiting for the next poll_interval tick.
dependencies = ["imagemagick", "udevadm"]

# ── Plugin-level settings (shared by every entry, edited in Settings -> Plugins) ──

[[setting]]
key = "battery_device"
type = "string"
label_key = "settings.battery_device.label"
description_key = "settings.battery_device.description"
default = "BAT0"

[[setting]]
key = "poll_interval"
type = "int"
label_key = "settings.poll_interval.label"
description_key = "settings.poll_interval.description"
default = 15
min = 5
max = 300

[[setting]]
key = "low_threshold"
type = "int"
label_key = "settings.low_threshold.label"
description_key = "settings.low_threshold.description"
default = 20
min = 1
max = 99

[[setting]]
key = "medium_threshold"
type = "int"
label_key = "settings.medium_threshold.label"
description_key = "settings.medium_threshold.description"
default = 50
min = 1
max = 99

# These feed ImageMagick's -fill (service.luau), which has no notion of
# Noctalia's color roles — a bare role name like "on_primary" fails with
# "no decode delegate for this image format" since magick tries to read it
# as a file. service.luau's resolveColor() resolves a role name (as typed
# by Noctalia's own color-role picker, e.g. "primary"/"on_hover") against
# the active custom palette file before it ever reaches magick, so both
# role names and hex work here the same as in any built-in Noctalia color
# setting. Defaults below stay fixed hex, matching the Indigo palette's
# error/primary/hover, in case a custom palette can't be resolved.

[[setting]]
key = "low_color"
type = "color"
label_key = "settings.low_color.label"
description_key = "settings.low_color.description"
default = "#FF6B81"

[[setting]]
key = "medium_color"
type = "color"
label_key = "settings.medium_color.label"
description_key = "settings.medium_color.description"
default = "#F2C94C"

[[setting]]
key = "high_color"
type = "color"
label_key = "settings.high_color.label"
description_key = "settings.high_color.description"
default = "#6FCF97"

[[setting]]
key = "charging_color"
type = "color"
label_key = "settings.charging_color.label"
description_key = "settings.charging_color.description"
default = "#B6C4FF"

[[setting]]
key = "text_color"
type = "color"
label_key = "settings.text_color.label"
description_key = "settings.text_color.description"
default = "#11131A"

[[setting]]
key = "empty_color"
type = "color"
label_key = "settings.empty_color.label"
description_key = "settings.empty_color.description"
default = "#33333F"

[[setting]]
key = "charging_sound_enabled"
type = "bool"
label_key = "settings.charging_sound_enabled.label"
description_key = "settings.charging_sound_enabled.description"
default = false

[[service]]
id = "poller"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "bar.luau"

  [[widget.setting]]
  key = "icon_width"
  type = "int"
  label_key = "settings.icon_width.label"
  description_key = "settings.icon_width.description"
  default = 45 # matches the rendered bitmap's 160x64 (2.5:1) aspect ratio at the default icon_height
  min = 16
  max = 96

  [[widget.setting]]
  key = "icon_height"
  type = "int"
  label_key = "settings.icon_height.label"
  description_key = "settings.icon_height.description"
  default = 18
  min = 8
  max = 48

  # Routed through the anchored panel-toggle dispatcher (same one native bar
  # widgets use) so Control Center opens under the click instead of centered
  # on the bar — noctalia.togglePanel()/CLI panel-toggle always open
  # unanchored. Matches the built-in battery widget's default gesture
  # (widget_gesture_defaults.cpp: kBattery). Users can override or disable it
  # per-instance in Settings, same as any built-in widget's actions.
  [widget.actions]
  left = "panel-toggle control-center power"
