[package]
name = "hyprland-share-picker-gtk"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_8"] }
gtk4-layer-shell = "0.4"
libwayshot = "0.9.0"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
glib = "0.20"
gio = "0.20"
gdk4 = "0.9"
cairo-rs = "0.20"
rustix = { version = "0.38", features = ["process"] }
libc = "0.2"
