[package]
name = "nixpp"
version = "0.5.0"
edition = "2024"
description = "Declarative Android guest system manager and native journaled controller"
license = "MIT"

[lib]
name = "nixpp"
path = "src/lib.rs"

[[bin]]
name = "nixpp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.6.11"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
