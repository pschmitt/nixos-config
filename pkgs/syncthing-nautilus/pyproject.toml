name = "syncthing-nautilus"
version = "0.1.0"
description = "Lightweight Syncthing status emblems for Nautilus"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools]
packages = ["syncthing_nautilus"]
