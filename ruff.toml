# Repo-wide Ruff settings; the Lint workflow checks every tracked Python file.
[lint]
select = ["E4", "E7", "E9", "F", "I"]

[lint.per-file-ignores]
# Import order (like formatting, see lint.sh) only for the CI tooling: Nix
# writers (writePython3) flake8-check packaged scripts at build time, with
# rules that conflict with Ruff's.
"!.github/**" = ["I"]
