# Obtainium itself, plus repo-tracking entries shared across devices via
# `imports:`. The auto-tracking setting applies to every device importing
# this file; device-specific entries can still live in that device's own
# `obtainium:` list.
obtainium_auto_track: true

apps:
  - name: "Obtainium"
    pkg: dev.imranr.obtainium.fdroid
    store: fdroid
