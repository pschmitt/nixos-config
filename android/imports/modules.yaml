# Root modules, shared across device configs via `imports:` (currently
# mp4 and px5 are rooted -- zf10 isn't and doesn't import this at all,
# see its own root.enabled: false). Same on-disk module.prop format works
# for both Magisk (mp4) and APatch (px5), per declaroid's own README.
# Add this to a device's own imports: list once that device is actually
# rooted, rather than copy-pasting the whole list.
modules:
  - id: playintegrityfix
    name: "Play Integrity Fix [INJECT]"
    source: github
    repo: KOWX712/PlayIntegrityFix
    asset: 'PlayIntegrityFix_v.*-1-inject-s\.zip$'

  # Replaces Tricky Store + Yurikey Manager -- module.prop id is literally
  # "specter" (confirmed by unzipping a real release).
  - id: specter
    name: "Specter"
    source: github
    repo: dpejoh/specter

  # A Tricky Store fork/successor (JingMatrix, a Tricky Store contributor)
  # -- its own module.prop id is literally "tricky_store" (confirmed by
  # unzipping a real release), same as the original module this replaced
  # above, so this occupies that same module directory rather than a new
  # one. Deliberately kept alongside Specter (which also claims to cover
  # key/attestation simulation) -- may overlap functionally at runtime,
  # a known tradeoff, not an oversight. Two release assets per version
  # (Debug/Release); asset: picks Release.
  - id: tricky_store
    name: "TEESimulator-RS"
    source: github
    repo: Enginex0/TEESimulator-RS
    asset: 'Release\.zip$'

  - id: YetAnotherBootloopProtector
    name: "Yet Another Bootloop Protector"
    source: github
    repo: Magisk-Modules-Alt-Repo/YetAnotherBootloopProtector

  - id: zygisksu
    name: "Zygisk Next"
    source: github
    repo: Dr-TSNG/ZygiskNext
