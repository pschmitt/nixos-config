# Apps that only make sense on a rooted device, imported by px5/mp4
# only -- zf10 isn't rooted and doesn't import this.
apps:
  # Installs whichever root framework this device itself is configured
  # for (mp4: magisk -- fails to patch its boot.img at all, kernel
  # probably compiled without KALLSYMS; px5: apatch), via root.framework:
  # type: config -- reads it from this same resolved config, not a
  # getprop, so this stays correct for any future device regardless of
  # its actual codename, unlike matching on ro.product.device the way
  # this used to. Both mp4.yaml/px5.yaml pin root.framework explicitly.
  - name: "APatch"
    pkg: me.bmax.apatch
    store: fdroid
    if:
      root.framework:
        type: config
        value: apatch

  - name: "Magisk"
    pkg: com.topjohnwu.magisk
    store: github
    repo: topjohnwu/Magisk
    if:
      root.framework:
        type: config
        value: magisk

  # Replaces WebUI X + MMRL -- a standalone KernelSU WebUI implementation,
  # same "module WebUI viewer" role, one app instead of two. Only makes
  # sense alongside Magisk itself, not APatch, same as what it replaced.
  # Three release assets (debug/release/release-mappings.zip, the last
  # not even an APK); asset: picks the plain release build.
  - name: "KsuWebUI"
    pkg: io.github.a13e300.ksuwebui
    store: github
    repo: adivenxnataly/KsuWebUI
    asset: 'release\.apk$'
    if:
      root.framework:
        type: config
        value: magisk

  - name: "Thor"
    pkg: com.valhalla.thor
    store: gplay

  - name: "Restoid"
    pkg: io.github.hddq.restoid
    store: fdroid

  - name: "Play Integrity API Checker"
    pkg: gr.nikolasspyr.integritycheck

  - name: "Duck Detector"
    pkg: com.eltavine.duckdetector
    store: github
    repo: eltavine/Duck-Detector-Refactoring
