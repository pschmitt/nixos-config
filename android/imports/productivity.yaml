# Productivity apps, shared across every device that imports this -- a
# device that doesn't want a specific entry excludes itself via if:,
# same pattern as imports/banking.yaml.
apps:
  # Only wanted by px5.
  - name: "Obsidian"
    pkg: md.obsidian
    if:
      ro.product.device: redfin

  # Only wanted by px5.
  - name: "Todoist"
    pkg: com.todoist
    if:
      ro.product.device: redfin

  - name: "Nextcloud"
    pkg: com.nextcloud.client

  # Retired from the Play Store; archived APK pulled from px5.
  - name: "ScanSnap Cloud"
    pkg: com.fujitsu.pfu.scansnapcloudeu
    store: url
    url: "https://blobs.brkn.lol/android/apps/ScanSnapCloud-1.8.2-55.apk"

  # Wanted by px5 (redfin) and zf10 (ASUS_AI2302), not mp4 (clover).
  - name: "Syncthing-Fork"
    pkg: com.github.catfriend1.syncthingfork
    store: fdroid
    if:
      not:
        ro.product.device: clover

  # Wanted by px5 and mp4, not zf10 (ASUS_AI2302).
  - name: "Pinkt"
    pkg: com.fibelatti.pinboard
    store: izzyondroid
    if:
      not:
        ro.product.device: ASUS_AI2302
