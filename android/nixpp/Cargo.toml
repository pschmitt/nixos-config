[package]
name = "nixpp"
version = "0.2.0"
edition = "2024"
description = "Small Nix binary-cache client for Termux-managed outputs"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
ed25519-dalek = "2.2"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
