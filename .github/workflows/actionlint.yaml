name: Actionlint

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    # Shared across workflows and PRs; queued jobs do not occupy runners.
    concurrency:
      group: nixos-config-runner-light
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@v2
        with:
          version: 1.7.12
          files: ".github/workflows/*.yaml, .github/workflows/*.yml"
          flags: -ignore=unexpected.key.*queue.*concurrency
          shellcheck: false
          pyflakes: false
