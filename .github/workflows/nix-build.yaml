    steps:
      # - name: Free Disk Space (Ubuntu)
      #   uses: jlumbroso/free-disk-space@main
      #   with:
      #     tool-cache: true

      - uses: wimpysworld/nothing-but-nix@main
        with:
          # 'cleave' removes docker, which we need later for qemu
          hatchet-protocol: 'carve'

