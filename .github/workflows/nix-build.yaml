    timeout-minutes: 120
    runs-on: ubuntu-latest
    env:
      NIX_STORE_PRIVKEY: ${{ secrets.NIX_STORE_PRIVKEY }}
    # runs-on: ubuntu-24.04-arm
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
