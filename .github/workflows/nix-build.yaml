              --copy

  build-droids-aarch64:
    needs:
      - setup-matrix
      - build-pkgs-free
      - build-pkgs-nonfree
      - build-pkgs-oci
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.setup-matrix.result == 'success' && fromJson(needs.setup-matrix.outputs.matrix).droid }}
    timeout-minutes: 120
    runs-on: ubuntu-latest
