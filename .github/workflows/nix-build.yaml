name: Nix build

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  schedule:
    - cron: "17 1 * * 6" # Weekly full validation, including reverse dependencies
  workflow_dispatch: # allows manual triggering

permissions:
  contents: read
  # GitHub OIDC tokens authenticate the niks3 uploads.
  id-token: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let main runs finish: a cancelled job pushes nothing to niks3, so slow
  # aarch64 builds (pica4) would never reach the cache. PRs still cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # https://nix.dev/manual/nix/2.18/advanced-topics/distributed-builds
  NIX_BUILDER: "ssh://${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} aarch64-linux,i686-linux,x86_64-linux /home/runner/.ssh/id_ed25519 - - - - -"
  # NOTE: Use `ssh://` (legacy protocol) for maximum compatibility with older Nix versions on the destination host.
  # `ssh-ng://` will fail with "protocol mismatch, got 'started'" when the remote Nix only speaks the legacy protocol.
  # Builds are pushed to niks3 (S3); the S3 store is also a substituter.
  NIKS3_SERVER_URL: ${{ vars.NIKS3_SERVER_URL }}
  NIKS3_S3_STORE: ${{ secrets.NIKS3_S3_STORE }}
  NIX_CACHE_SCOPE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.ref == 'refs/heads/main' && 'main' || 'manual') }}
  nix-conf: |-
    fallback = true # build from source if a binary substitute fails
    extra-experimental-features = nix-command flakes
    accept-flake-config = true
    substituters = https://cache.nixos.org/ https://hyprland.cachix.org https://nix-community.cachix.org ssh://${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}?ssh-key=/home/runner/.ssh/id_ed25519&trusted=true
    trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc= nix-cache.brkn.lol:k/zdgSv+6lcJ/9DRILjA7H18eIlFSA0OwzyqqXEwySM= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= rofl-10:vYRBSypcO/0NnPsDxgSELIcJotU/LmZ1f6vZUKUmty0= rofl-13:ESRCqy2jcftg690k98KSNqF6LgOqz1X7ZnXXE//WWD0=
    extra-substituters = ssh://${{ secrets.SSH_USERNAME }}@cache.rofl-14.brkn.lol?ssh-key=/home/runner/.ssh/id_ed25519&trusted=true
    extra-platforms = aarch64-linux i686-linux
    builders-use-substitutes = true
    # NOTE needs a PAT (not the workflow's GITHUB_TOKEN, which is scoped to
    # this repo only) so nix can fetch the private nixos-config-private input
    access-tokens = github.com=${{ secrets.GH_TOKEN_FOR_UPDATES }}

jobs:
  tooling:
    name: CI tooling
    runs-on: ubuntu-latest
    # Shared across workflows and PRs; queued jobs do not occupy runners.
    concurrency:
      group: nixos-config-runner-light
      cancel-in-progress: false
      queue: max
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select tooling checks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          needed="$(python3 .github/workflows/scripts/ci-scope.py --tooling-only)"
          echo "needed=${needed}" >> "$GITHUB_OUTPUT"
      - uses: DeterminateSystems/nix-installer-action@main
        if: steps.scope.outputs.needed == 'true'
      - name: Check shell and Python
        if: steps.scope.outputs.needed == 'true'
        run: |
          revision="$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)"
          nix shell \
            "github:NixOS/nixpkgs/${revision}#shellcheck" \
            "github:NixOS/nixpkgs/${revision}#ruff" \
            --command bash .github/workflows/scripts/check-ci.sh
      - name: Run CI regression tests
        if: steps.scope.outputs.needed == 'true'
        run: python3 -m unittest discover -s .github/tests -v

  setup-matrix:
    needs: tooling
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    timeout-minutes: 120
    runs-on: ubuntu-latest
    # Shared across workflows and PRs; queued jobs do not occupy runners.
    concurrency:
      group: nixos-config-runner-nix
      cancel-in-progress: false
      queue: max
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changes before Nix setup
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          needed="$(python3 .github/workflows/scripts/ci-scope.py --classify-only)"
          echo "needed=${needed}" >> "$GITHUB_OUTPUT"

      - name: Set up SSH stores
        if: steps.scope.outputs.needed == 'true'
        uses: ./.github/actions/nix-ssh
        with:
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          hosts: ${{ secrets.SSH_HOST }} cache.rofl-14.brkn.lol

      - name: Set up evaluation emulation
        if: steps.scope.outputs.needed == 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Nix
        if: steps.scope.outputs.needed == 'true'
        uses: ./.github/actions/nix-setup
        with:
          nix-conf: ${{ env.nix-conf }}
          s3-store: ${{ env.NIKS3_S3_STORE }}
          s3-access-key: ${{ secrets.NIKS3_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.NIKS3_S3_SECRET_KEY }}
          save-cache: "true"

      - name: Restore evaluated derivations
        if: steps.scope.outputs.needed == 'true'
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: .cache/ci-drvs
          key: ci-drvs-${{ runner.os }}-${{ hashFiles('.github/workflows/scripts/ci-scope.py') }}-${{ github.sha }}
          restore-keys: |
            ci-drvs-${{ runner.os }}-${{ hashFiles('.github/workflows/scripts/ci-scope.py') }}-${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Generate build matrix
        id: set-matrix
        env:
          CI_DRV_CACHE: .cache/ci-drvs
          CI_HEAD_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          # Assign first so a failing script fails this step (errexit does
          # not propagate through a command substitution inside echo)
          matrix="$(python3 .github/workflows/scripts/ci-scope.py)"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

      - name: Save evaluated derivations
        if: ${{ !cancelled() && steps.scope.outputs.needed == 'true' }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: .cache/ci-drvs
          key: ci-drvs-${{ runner.os }}-${{ hashFiles('.github/workflows/scripts/ci-scope.py') }}-${{ github.sha }}

  build-pkgs-free:
    if: ${{ needs.setup-matrix.outputs.matrix != '' && toJson(fromJson(needs.setup-matrix.outputs.matrix).pkgs.free) != '[]' }}
    name: build ${{ matrix.pkg.name }} (${{ matrix.system }})
    needs: setup-matrix
    timeout-minutes: 120
    runs-on: ubuntu-24.04-arm
    # Shared across workflows and PRs; queued jobs do not occupy runners.
    concurrency:
      group: nixos-config-runner-nix
      cancel-in-progress: false
      queue: max
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup-matrix.outputs.matrix).pkgs.free }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: ./.github/actions/nix-setup
        with:
          nix-conf: ${{ env.nix-conf }}
          s3-store: ${{ env.NIKS3_S3_STORE }}
          s3-access-key: ${{ secrets.NIKS3_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.NIKS3_S3_SECRET_KEY }}

      - name: Set up SSH stores
        uses: ./.github/actions/nix-ssh
        with:
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          hosts: ${{ secrets.SSH_HOST }} cache.rofl-14.brkn.lol

      - name: Check retained remote output
        id: cache
        run: |
          if ./.github/workflows/scripts/ci-build.sh --pkg '${{ matrix.pkg.name }}' --system '${{ matrix.system }}' --check-cache
          then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi


      - name: Build package
        run: |-
          ./.github/workflows/scripts/ci-build.sh \
            --pkg '${{ matrix.pkg.name }}' \
            --system '${{ matrix.system }}'

      - name: "Push package to niks3"
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: |
            ./.github/workflows/scripts/ci-build.sh \
              --pkg '${{ matrix.pkg.name }}' \
              --system '${{ matrix.system }}' \
              --copy

  build-pkgs-nonfree:
    if: ${{ needs.setup-matrix.outputs.matrix != '' && toJson(fromJson(needs.setup-matrix.outputs.matrix).pkgs.nonfree) != '[]' }}
    name: build-nonfree ${{ matrix.pkg.name }} (${{ matrix.system }})
    needs: setup-matrix
    timeout-minutes: 120
    runs-on: ubuntu-24.04-arm
    # Shared across workflows and PRs; queued jobs do not occupy runners.
    concurrency:
      group: nixos-config-runner-nix
      cancel-in-progress: false
      queue: max
    env:
      NIXPKGS_ALLOW_UNFREE: 1
      SSH_PRIVATE_KEY_PATH: "/home/runner/.ssh/id_ed25519"
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup-matrix.outputs.matrix).pkgs.nonfree }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: ./.github/actions/nix-setup
        with:
          nix-conf: ${{ env.nix-conf }}
          s3-store: ${{ env.NIKS3_S3_STORE }}
          s3-access-key: ${{ secrets.NIKS3_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.NIKS3_S3_SECRET_KEY }}

      - name: Set up SSH stores
        uses: ./.github/actions/nix-ssh
        with:
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          hosts: ${{ secrets.SSH_HOST }} cache.rofl-14.brkn.lol

      - name: Check retained remote output
        id: cache
        run: |
          if ./.github/workflows/scripts/ci-build.sh --pkg '${{ matrix.pkg.name }}' --system '${{ matrix.system }}' --nonfree --check-cache
          then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi


      - name: Fetch proprietary garbage
        if: steps.cache.outputs.hit != 'true'
        uses: nick-fields/retry@v4
        env:
          BLOBS_BASIC_AUTH: ${{ secrets.BLOBS_BASIC_AUTH }}
        with:
          timeout_minutes: 5
          max_attempts: 3
          shell: bash
          command: |-
            ./scripts/fetch-proprietary-garbage.sh

      - name: Trick flake by git adding all files (ignoring .gitignore)
        if: steps.cache.outputs.hit != 'true'
        run: |-
          git add --intent-to-add --force .

      - name: Build package
        run: |-
          ./.github/workflows/scripts/ci-build.sh \
            --pkg '${{ matrix.pkg.name }}' \
            --system '${{ matrix.system }}' \
            --nonfree

      - name: "Push package to niks3"
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: |
            ./.github/workflows/scripts/ci-build.sh \
              --pkg '${{ matrix.pkg.name }}' \
              --system '${{ matrix.system }}' \
              --nonfree \
              --copy

  build-pkgs-oci:
    if: ${{ needs.setup-matrix.outputs.matrix != '' && toJson(fromJson(needs.setup-matrix.outputs.matrix).pkgs.oci) != '[]' }}
    name: build-oci ${{ matrix.pkg.name }} (${{ matrix.system }})
    needs: setup-matrix
    timeout-minutes: 120
    runs-on: ubuntu-24.04-arm
    # Shared across workflows and PRs; queued jobs do not occupy runners.
    concurrency:
      group: nixos-config-runner-nix
      cancel-in-progress: false
      queue: max
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup-matrix.outputs.matrix).pkgs.oci }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: ./.github/actions/nix-setup
        with:
          nix-conf: ${{ env.nix-conf }}
          s3-store: ${{ env.NIKS3_S3_STORE }}
          s3-access-key: ${{ secrets.NIKS3_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.NIKS3_S3_SECRET_KEY }}

      - name: Set up SSH stores
        uses: ./.github/actions/nix-ssh
        with:
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          hosts: ${{ secrets.SSH_HOST }} cache.rofl-14.brkn.lol

      - name: Check retained remote output
        id: cache
        run: |
          if ./.github/workflows/scripts/ci-build.sh --pkg '${{ matrix.pkg.name }}' --system '${{ matrix.system }}' --oci --check-cache
          then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi


      - name: Netbird Connect
        if: steps.cache.outputs.hit != 'true'
        id: netbird
        uses: Alemiz112/netbird-connect@master
        with:
          setup-key: ${{ secrets.NB_SETUP_KEY }}

      - name: Wait for Netbird routes
        if: steps.cache.outputs.hit != 'true'
        env:
          NB_INTERFACE: wt0
          YUM_DOMAIN: yum.eu-frankfurt-1.oci.oraclecloud.com
          WAIT_SECS: "180"
          SLEEP_SECS: "3"
        run: |
          set -euo pipefail
          deadline=$((SECONDS + WAIT_SECS))

          echo "Waiting for $YUM_DOMAIN to route via $NB_INTERFACE"

          while (( SECONDS < deadline ))
          do
            if ! mapfile -t ips < <(dig +short A "$YUM_DOMAIN" | grep -v '^$')
            then
              echo "dig failed, retrying..."
              sleep "$SLEEP_SECS"
              continue
            fi

            if (( ${#ips[@]} == 0 ))
            then
              echo "No IPs resolved yet, retrying..."
              sleep "$SLEEP_SECS"
              continue
            fi

            READY=1
            for ip in "${ips[@]}"
            do
              if ! route_json=$(ip -j route get "$ip" 2>/dev/null)
              then
                READY=
                break
              fi

              if ! jq -e --arg iface "$NB_INTERFACE" '
                .[0].dev == $iface
              ' <<<"$route_json" >/dev/null
              then
                READY=
                break
              fi
            done

            if [[ -n "${READY:-}" ]]
            then
              echo "All $YUM_DOMAIN routes go via $NB_INTERFACE"
              exit 0
            fi

            sleep "$SLEEP_SECS"
          done

          echo "Timed out waiting for $YUM_DOMAIN routes via $NB_INTERFACE" >&2
          ip r
          exit 1

      - name: Build package
        run: |-
          ./.github/workflows/scripts/ci-build.sh \
            --pkg '${{ matrix.pkg.name }}' \
            --system '${{ matrix.system }}' \
            --oci

      - name: "Push package to niks3"
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: |
            ./.github/workflows/scripts/ci-build.sh \
              --pkg '${{ matrix.pkg.name }}' \
              --system '${{ matrix.system }}' \
              --oci \
              --copy

  build-hosts-aarch64:
    needs:
      - setup-matrix
      - build-pkgs-free
      - build-pkgs-nonfree
      - build-pkgs-oci
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.setup-matrix.result == 'success' && toJson(fromJson(needs.setup-matrix.outputs.matrix).hosts.aarch64) != '[]' }}
    timeout-minutes: 120
    runs-on: ubuntu-24.04-arm
    # Shared across workflows and PRs; queued jobs do not occupy runners.
    concurrency:
      group: nixos-config-runner-nix
      cancel-in-progress: false
      queue: max
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.setup-matrix.outputs.matrix).hosts.aarch64 }}
    steps:
      # - name: Free Disk Space (Ubuntu)
      #   uses: jlumbroso/free-disk-space@main
      #   with:
      #     tool-cache: true

      - uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: 'cleave'

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: ./.github/actions/nix-setup
        with:
          nix-conf: ${{ env.nix-conf }}
          s3-store: ${{ env.NIKS3_S3_STORE }}
          s3-access-key: ${{ secrets.NIKS3_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.NIKS3_S3_SECRET_KEY }}

      - name: Set up SSH stores
        uses: ./.github/actions/nix-ssh
        with:
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          hosts: ${{ secrets.SSH_HOST }} cache.rofl-14.brkn.lol

      - name: Check retained remote output
        id: cache
        run: |
          if ./.github/workflows/scripts/ci-build.sh --host '${{ matrix.host }}' --check-cache
          then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch proprietary garbage
        if: steps.cache.outputs.hit != 'true'
        uses: nick-fields/retry@v4
        env:
          BLOBS_BASIC_AUTH: ${{ secrets.BLOBS_BASIC_AUTH }}
        with:
          timeout_minutes: 5
          max_attempts: 3
          shell: bash
          command: |-
            ./scripts/fetch-proprietary-garbage.sh

      - name: Add proprietary garbage to Nix store
        if: steps.cache.outputs.hit != 'true'
        run: |
          find . -name sha256sum.txt | while read -r checksum_file
          do
            dir=$(dirname "$checksum_file")
            awk '{print $2}' "$checksum_file" | while read -r filename
            do
              if [[ -f "$dir/$filename" ]]
              then
                echo "Adding $dir/$filename to Nix store..."
                nix-store --add-fixed sha256 "$dir/$filename"
              fi
            done
          done


      - name: Netbird Connect
        if: steps.cache.outputs.hit != 'true'
        id: netbird
        uses: Alemiz112/netbird-connect@master
        with:
          # management-url: https://api.netbird.io:443
          setup-key: ${{ secrets.NB_SETUP_KEY }}

      - name: Wait for Netbird routes
        if: steps.cache.outputs.hit != 'true'
        env:
          NB_INTERFACE: wt0
          YUM_DOMAIN: yum.eu-frankfurt-1.oci.oraclecloud.com
          WAIT_SECS: "180"
          SLEEP_SECS: "3"
        run: |
          set -euo pipefail
          deadline=$((SECONDS + WAIT_SECS))

          echo "Waiting for $YUM_DOMAIN to route via $NB_INTERFACE"

          while (( SECONDS < deadline ))
          do
            if ! mapfile -t ips < <(dig +short A "$YUM_DOMAIN" | grep -v '^$')
            then
              echo "dig failed, retrying..."
              sleep "$SLEEP_SECS"
              continue
            fi

            if (( ${#ips[@]} == 0 ))
            then
              echo "No IPs resolved yet, retrying..."
              sleep "$SLEEP_SECS"
              continue
            fi

            READY=1
            for ip in "${ips[@]}"
            do
              if ! route_json=$(ip -j route get "$ip" 2>/dev/null)
              then
                READY=
                break
              fi

              if ! jq -e --arg iface "$NB_INTERFACE" '
                .[0].dev == $iface
              ' <<<"$route_json" >/dev/null
              then
                READY=
                break
              fi
            done

            if [[ -n "${READY:-}" ]]
            then
              echo "All $YUM_DOMAIN routes go via $NB_INTERFACE"
              exit 0
            fi

            sleep "$SLEEP_SECS"
          done

          echo "Timed out waiting for $YUM_DOMAIN routes via $NB_INTERFACE" >&2
          ip r
          exit 1

      - name: Build nixosConfiguration
        run: |-
          ./.github/workflows/scripts/ci-build.sh \
            --host '${{ matrix.host }}'

      - name: "Push package to niks3"
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: |
            ./.github/workflows/scripts/ci-build.sh \
              --host '${{ matrix.host }}' \
              --copy

  build-droids-aarch64:
    needs:
      - setup-matrix
      - build-pkgs-free
      - build-pkgs-nonfree
      - build-pkgs-oci
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.setup-matrix.result == 'success' && fromJson(needs.setup-matrix.outputs.matrix).droid }}
    timeout-minutes: 120
    runs-on: ubuntu-24.04-arm
    # Shared across workflows and PRs; queued jobs do not occupy runners.
    concurrency:
      group: nixos-config-runner-nix
      cancel-in-progress: false
      queue: max
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        droid: [ "zf10" ]
    steps:
      - uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: 'cleave'

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: ./.github/actions/nix-setup
        with:
          nix-conf: ${{ env.nix-conf }}
          s3-store: ${{ env.NIKS3_S3_STORE }}
          s3-access-key: ${{ secrets.NIKS3_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.NIKS3_S3_SECRET_KEY }}

      - name: Set up SSH stores
        uses: ./.github/actions/nix-ssh
        with:
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          hosts: ${{ secrets.SSH_HOST }} cache.rofl-14.brkn.lol

      - name: Check retained remote output
        id: cache
        run: |
          if ./.github/workflows/scripts/ci-build.sh --droid '${{ matrix.droid }}' --check-cache
          then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi


      - name: Build nixOnDroidConfiguration
        run: |-
          ./.github/workflows/scripts/ci-build.sh \
            --droid '${{ matrix.droid }}'

      - name: "Push nixOnDroidConfiguration to niks3"
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: |
            ./.github/workflows/scripts/ci-build.sh \
             --droid '${{ matrix.droid }}' \
             --copy

  # pr-nvd-diff was intentionally removed.
  # A dedicated PR workflow now handles per-host diffs without builds:
  # `.github/workflows/nix-systempackages-diff.yaml`.

  build-result:
    name: Nix build result
    if: ${{ always() }}
    needs: [tooling, setup-matrix, build-pkgs-free, build-pkgs-nonfree, build-pkgs-oci, build-hosts-aarch64, build-droids-aarch64]
    runs-on: ubuntu-latest
    # Shared across workflows and PRs; queued jobs do not occupy runners.
    concurrency:
      group: nixos-config-runner-light
      cancel-in-progress: false
      queue: max
    timeout-minutes: 2
    steps:
      - name: Check selected builds
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$RESULTS"
