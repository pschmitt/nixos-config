name: Nix build

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  schedule:
    - cron: "17 1 * * 6" # Weekly full validation, including reverse dependencies
  workflow_dispatch: # allows manual triggering

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # https://nix.dev/manual/nix/2.18/advanced-topics/distributed-builds
  NIX_BUILDER: "ssh://${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} aarch64-linux,i686-linux,x86_64-linux /home/runner/.ssh/id_ed25519 - - - - -"
  # NOTE: Use `ssh://` (legacy protocol) for maximum compatibility with older Nix versions on the destination host.
  # `ssh-ng://` will fail with "protocol mismatch, got 'started'" when the remote Nix only speaks the legacy protocol.
  NIX_DEST_STORE_URL: "ssh://${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}?ssh-key=/home/runner/.ssh/id_ed25519"
  nix-conf: |-
    fallback = true # build from source if a binary substitute fails
    extra-experimental-features = nix-command flakes
    accept-flake-config = true
    substituters = https://cache.nixos.org/ https://hyprland.cachix.org https://hyprland.cachix.org https://nix-community.cachix.org ssh://${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}?ssh-key=/home/runner/.ssh/id_ed25519&trusted=true
    trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc= nix-cache.brkn.lol:k/zdgSv+6lcJ/9DRILjA7H18eIlFSA0OwzyqqXEwySM= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= rofl-10:vYRBSypcO/0NnPsDxgSELIcJotU/LmZ1f6vZUKUmty0= rofl-13:ESRCqy2jcftg690k98KSNqF6LgOqz1X7ZnXXE//WWD0=
    extra-platforms = aarch64-linux i686-linux
    builders-use-substitutes = true
    # NOTE needs a PAT (not the workflow's GITHUB_TOKEN, which is scoped to
    # this repo only) so nix can fetch the private nixos-config-private input
    access-tokens = github.com=${{ secrets.GH_TOKEN_FOR_UPDATES }}

jobs:
  setup-matrix:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    timeout-minutes: 120
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: ${{ env.nix-conf }}

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 2G

      - name: Generate build matrix
        id: set-matrix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          # Assign first so a failing script fails this step (errexit does
          # not propagate through a command substitution inside echo)
          matrix="$(python3 .github/workflows/scripts/ci-scope.py)"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  build-pkgs-free:
    if: ${{ needs.setup-matrix.outputs.matrix != '' && toJson(fromJson(needs.setup-matrix.outputs.matrix).pkgs.free) != '[]' }}
    name: build ${{ matrix.pkg.name }} (${{ matrix.system }})
    needs: setup-matrix
    timeout-minutes: 120
    runs-on: ubuntu-latest
    env:
      NIX_STORE_PRIVKEY: ${{ secrets.NIX_STORE_PRIVKEY }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup-matrix.outputs.matrix).pkgs.free }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: ${{ env.nix-conf }}

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false

      - name: Store SSH key on disk
        run: |-
          mkdir -p "${HOME}/.ssh"
          KEY_PATH="${HOME}/.ssh/id_ed25519"
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > "$KEY_PATH"
          chmod 400 "$KEY_PATH"

          # GitHub runners (Azure) drop TCP flows idle for ~4 minutes, which
          # kills remote builds that go quiet (e.g. rustc linking the final
          # crate) with "unexpected end-of-file". Keep the connection
          # alive; system-wide since the root nix-daemon opens it.
          sudo tee /etc/ssh/ssh_config.d/99-keepalive.conf >/dev/null <<'SSHCONF'
          Host *
            ServerAliveInterval 30
            ServerAliveCountMax 10
          SSHCONF

      - name: Setup known_hosts
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 1
          max_attempts: 3
          shell: bash
          command: |
            set -o pipefail
            ssh-keyscan "${{ secrets.SSH_HOST }}" | \
              sudo tee -a "${HOME}/.ssh/known_hosts" /etc/ssh/ssh_known_hosts

      - name: Set up QEMU
        if: ${{ matrix.system == 'aarch64-linux' }}
        uses: docker/setup-qemu-action@v4

      - name: Build package
        run: |-
          ./.github/workflows/scripts/ci-build.sh \
            --pkg '${{ matrix.pkg.name }}' \
            --system '${{ matrix.system }}'

      - name: "Nix copy package"
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: |
            ssh-keyscan "${{ secrets.SSH_HOST }}"
            echo "Known hosts:"
            cat /etc/ssh/ssh_known_hosts

            ./.github/workflows/scripts/ci-build.sh \
              --pkg '${{ matrix.pkg.name }}' \
              --system '${{ matrix.system }}' \
              --copy

  build-pkgs-nonfree:
    if: ${{ needs.setup-matrix.outputs.matrix != '' && toJson(fromJson(needs.setup-matrix.outputs.matrix).pkgs.nonfree) != '[]' }}
    name: build-nonfree ${{ matrix.pkg.name }} (${{ matrix.system }})
    needs: setup-matrix
    timeout-minutes: 120
    runs-on: ubuntu-latest
    env:
      NIXPKGS_ALLOW_UNFREE: 1
      NIX_STORE_PRIVKEY: ${{ secrets.NIX_STORE_PRIVKEY }}
      SSH_PRIVATE_KEY_PATH: "/home/runner/.ssh/id_ed25519"
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup-matrix.outputs.matrix).pkgs.nonfree }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: ${{ env.nix-conf }}

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false

      - name: Store SSH key on disk
        run: |-
          mkdir -p "${HOME}/.ssh"
          KEY_PATH="${HOME}/.ssh/id_ed25519"
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > "$KEY_PATH"
          chmod 400 "$KEY_PATH"

          # GitHub runners (Azure) drop TCP flows idle for ~4 minutes, which
          # kills remote builds that go quiet (e.g. rustc linking the final
          # crate) with "unexpected end-of-file". Keep the connection
          # alive; system-wide since the root nix-daemon opens it.
          sudo tee /etc/ssh/ssh_config.d/99-keepalive.conf >/dev/null <<'SSHCONF'
          Host *
            ServerAliveInterval 30
            ServerAliveCountMax 10
          SSHCONF

      - name: Setup known_hosts
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 1
          max_attempts: 3
          shell: bash
          command: |
            set -o pipefail
            ssh-keyscan "${{ secrets.SSH_HOST }}" | \
              sudo tee -a "${HOME}/.ssh/known_hosts" /etc/ssh/ssh_known_hosts

      - name: Set up QEMU
        if: ${{ matrix.system == 'aarch64-linux' }}
        uses: docker/setup-qemu-action@v4

      - name: Fetch proprietary garbage
        uses: nick-fields/retry@v4
        env:
          BLOBS_BASIC_AUTH: ${{ secrets.BLOBS_BASIC_AUTH }}
        with:
          timeout_minutes: 5
          max_attempts: 3
          shell: bash
          command: |-
            ./scripts/fetch-proprietary-garbage.sh

      - name: Trick flake by git adding all files (ignoring .gitignore)
        run: |-
          git add --intent-to-add --force .

      - name: Build package
        run: |-
          ./.github/workflows/scripts/ci-build.sh \
            --pkg '${{ matrix.pkg.name }}' \
            --system '${{ matrix.system }}' \
            --nonfree

      - name: "Nix copy package"
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: |
            ssh-keyscan "${{ secrets.SSH_HOST }}"
            echo "Known hosts:"
            cat /etc/ssh/ssh_known_hosts

            ./.github/workflows/scripts/ci-build.sh \
              --pkg '${{ matrix.pkg.name }}' \
              --system '${{ matrix.system }}' \
              --nonfree \
              --copy

  build-pkgs-oci:
    if: ${{ needs.setup-matrix.outputs.matrix != '' && toJson(fromJson(needs.setup-matrix.outputs.matrix).pkgs.oci) != '[]' }}
    name: build-oci ${{ matrix.pkg.name }} (${{ matrix.system }})
    needs: setup-matrix
    timeout-minutes: 120
    runs-on: ubuntu-latest
    env:
      NIX_STORE_PRIVKEY: ${{ secrets.NIX_STORE_PRIVKEY }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup-matrix.outputs.matrix).pkgs.oci }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: ${{ env.nix-conf }}

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false

      - name: Store SSH key on disk
        run: |-
          mkdir -p "${HOME}/.ssh"
          KEY_PATH="${HOME}/.ssh/id_ed25519"
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > "$KEY_PATH"
          chmod 400 "$KEY_PATH"

          # GitHub runners (Azure) drop TCP flows idle for ~4 minutes, which
          # kills remote builds that go quiet (e.g. rustc linking the final
          # crate) with "unexpected end-of-file". Keep the connection
          # alive; system-wide since the root nix-daemon opens it.
          sudo tee /etc/ssh/ssh_config.d/99-keepalive.conf >/dev/null <<'SSHCONF'
          Host *
            ServerAliveInterval 30
            ServerAliveCountMax 10
          SSHCONF

      - name: Setup known_hosts
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 1
          max_attempts: 3
          shell: bash
          command: |
            set -o pipefail
            ssh-keyscan "${{ secrets.SSH_HOST }}" | \
              sudo tee -a "${HOME}/.ssh/known_hosts" /etc/ssh/ssh_known_hosts

      - name: Set up QEMU
        if: ${{ matrix.system == 'aarch64-linux' }}
        uses: docker/setup-qemu-action@v4

      - name: Netbird Connect
        id: netbird
        uses: Alemiz112/netbird-connect@master
        with:
          setup-key: ${{ secrets.NB_SETUP_KEY }}

      - name: Wait for Netbird routes
        env:
          NB_INTERFACE: wt0
          YUM_DOMAIN: yum.eu-frankfurt-1.oci.oraclecloud.com
          WAIT_SECS: "180"
          SLEEP_SECS: "3"
        run: |
          set -euo pipefail
          deadline=$((SECONDS + WAIT_SECS))

          echo "Waiting for $YUM_DOMAIN to route via $NB_INTERFACE"

          while (( SECONDS < deadline ))
          do
            if ! mapfile -t ips < <(dig +short A "$YUM_DOMAIN" | grep -v '^$')
            then
              echo "dig failed, retrying..."
              sleep "$SLEEP_SECS"
              continue
            fi

            if (( ${#ips[@]} == 0 ))
            then
              echo "No IPs resolved yet, retrying..."
              sleep "$SLEEP_SECS"
              continue
            fi

            READY=1
            for ip in "${ips[@]}"
            do
              if ! route_json=$(ip -j route get "$ip" 2>/dev/null)
              then
                READY=
                break
              fi

              if ! jq -e --arg iface "$NB_INTERFACE" '
                .[0].dev == $iface
              ' <<<"$route_json" >/dev/null
              then
                READY=
                break
              fi
            done

            if [[ -n "${READY:-}" ]]
            then
              echo "All $YUM_DOMAIN routes go via $NB_INTERFACE"
              exit 0
            fi

            sleep "$SLEEP_SECS"
          done

          echo "Timed out waiting for $YUM_DOMAIN routes via $NB_INTERFACE" >&2
          ip r
          exit 1

      - name: Build package
        run: |-
          ./.github/workflows/scripts/ci-build.sh \
            --pkg '${{ matrix.pkg.name }}' \
            --system '${{ matrix.system }}' \
            --oci

      - name: "Nix copy package"
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: |
            ssh-keyscan "${{ secrets.SSH_HOST }}"
            echo "Known hosts:"
            cat /etc/ssh/ssh_known_hosts

            ./.github/workflows/scripts/ci-build.sh \
              --pkg '${{ matrix.pkg.name }}' \
              --system '${{ matrix.system }}' \
              --oci \
              --copy

  build-hosts-x86_64:
    needs:
      - setup-matrix
      - build-pkgs-free
      - build-pkgs-nonfree
      - build-pkgs-oci
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.setup-matrix.result == 'success' && toJson(fromJson(needs.setup-matrix.outputs.matrix).hosts.amd64) != '[]' }}
    timeout-minutes: 120
    runs-on: ubuntu-latest
    env:
      NIX_STORE_PRIVKEY: ${{ secrets.NIX_STORE_PRIVKEY }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.setup-matrix.outputs.matrix).hosts.amd64 }}
    steps:
      # - name: Free Disk Space (Ubuntu)
      #   uses: jlumbroso/free-disk-space@main
      #   with:
      #     tool-cache: true

      - uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: 'cleave'

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: ${{ env.nix-conf }}

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false

      - name: Store SSH key on disk
        run: |-
          mkdir -p "${HOME}/.ssh"
          KEY_PATH="${HOME}/.ssh/id_ed25519"
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > "$KEY_PATH"
          chmod 400 "$KEY_PATH"

          # GitHub runners (Azure) drop TCP flows idle for ~4 minutes, which
          # kills remote builds that go quiet (e.g. rustc linking the final
          # crate) with "unexpected end-of-file". Keep the connection
          # alive; system-wide since the root nix-daemon opens it.
          sudo tee /etc/ssh/ssh_config.d/99-keepalive.conf >/dev/null <<'SSHCONF'
          Host *
            ServerAliveInterval 30
            ServerAliveCountMax 10
          SSHCONF

      - name: Setup known_hosts
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 1
          max_attempts: 3
          shell: bash
          command: |
            set -o pipefail
            ssh-keyscan "${{ secrets.SSH_HOST }}" | \
              sudo tee -a "${HOME}/.ssh/known_hosts" /etc/ssh/ssh_known_hosts

      - name: Fetch proprietary garbage
        uses: nick-fields/retry@v4
        env:
          BLOBS_BASIC_AUTH: ${{ secrets.BLOBS_BASIC_AUTH }}
        with:
          timeout_minutes: 5
          max_attempts: 3
          shell: bash
          command: |-
            ./scripts/fetch-proprietary-garbage.sh

      - name: Add proprietary garbage to Nix store
        run: |
          find . -name sha256sum.txt | while read checksum_file; do
            dir=$(dirname "$checksum_file")
            awk '{print $2}' "$checksum_file" | while read filename; do
              if [ -f "$dir/$filename" ]; then
                echo "Adding $dir/$filename to Nix store..."
                nix-store --add-fixed sha256 "$dir/$filename"
              fi
            done
          done

      - name: Build nixosConfiguration
        run: |-
          ./.github/workflows/scripts/ci-build.sh \
            --host '${{ matrix.host }}'

      - name: "Nix copy package"
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: |
            # DEBUG
            ssh-keyscan "${{ secrets.SSH_HOST }}"
            echo "Known hosts:"
            cat /etc/ssh/ssh_known_hosts

            ./.github/workflows/scripts/ci-build.sh \
              --host '${{ matrix.host }}' \
              --copy

