name: Statix Lint

on:
  push:
    branches: [main]
    paths:
      - "**/*.nix"
  pull_request:
    paths:
      - "**/*.nix"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    # Shared across workflows and PRs; queued jobs do not occupy runners.
    concurrency:
      group: nixos-config-runner-light
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Run statix
        run: nix run 'nixpkgs#statix' -- check
