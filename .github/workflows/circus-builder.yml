# Ephemeral Circus agents for trusted ARM and x86_64 KVM builds.
# The queue-runner dispatches this workflow and the agent joins via GitHub OIDC.
name: Circus Builder

on:
  workflow_dispatch:
    inputs:
      runner_url:
        required: true
        type: string
      oidc_audience:
        required: true
        type: string
      agent_binary_url:
        description: Pinned circus-agent binary URL or x86_64 flake package matching the queue-runner
        required: true
        type: string
      systems:
        description: Comma-separated Nix systems
        required: true
        type: string
      supported_features:
        description: Comma-separated supported system features
        required: false
        type: string
        default: ""
      mandatory_features:
        description: Comma-separated mandatory system features
        required: false
        type: string
        default: ""
      max_jobs:
        required: true
        type: string
      cores:
        required: true
        type: string
      speed_factor:
        required: true
        type: string
      agent_name:
        required: true
        type: string
  workflow_call:
    inputs:
      runner_url:
        required: true
        type: string
      oidc_audience:
        required: true
        type: string
      agent_binary_url:
        description: Pinned circus-agent binary URL or x86_64 flake package matching the queue-runner
        required: true
        type: string
      systems:
        description: Comma-separated Nix systems
        required: true
        type: string
      supported_features:
        description: Comma-separated supported system features
        required: false
        type: string
        default: ""
      mandatory_features:
        description: Comma-separated mandatory system features
        required: false
        type: string
        default: ""
      max_jobs:
        required: true
        type: string
      cores:
        required: true
        type: string
      speed_factor:
        required: true
        type: string
      agent_name:
        required: true
        type: string
    secrets:
      NB_SETUP_KEY:
        required: true
      NIKS3_S3_STORE:
        required: false
      NIKS3_S3_ACCESS_KEY:
        required: false
      NIKS3_S3_SECRET_KEY:
        required: false

permissions:
  contents: read
  id-token: write

env:
  # Same caches as nix-build.yaml: the agent substitutes everything it can
  # (cache.nixos.org, nix-community, niks3) instead of building it.
  # Many paths in the S3 store are signed only by rofl-10.
  NIKS3_S3_STORE: ${{ secrets.NIKS3_S3_STORE }}
  nix-conf: |-
    fallback = true
    extra-experimental-features = nix-command flakes
    substituters = https://cache.nixos.org/ https://nix-community.cachix.org
    trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-cache.brkn.lol:k/zdgSv+6lcJ/9DRILjA7H18eIlFSA0OwzyqqXEwySM= rofl-10:vYRBSypcO/0NnPsDxgSELIcJotU/LmZ1f6vZUKUmty0= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

jobs:
  build-agent:
    runs-on: ${{ inputs.systems == 'x86_64-linux' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Enable and verify KVM
        if: inputs.systems == 'x86_64-linux'
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          python3 - <<'PYTHON'
          import fcntl
          import os

          with open("/dev/kvm", "r+b", buffering=0) as kvm:
              vm = fcntl.ioctl(kvm, 0xAE01, 0)  # KVM_CREATE_VM
              os.close(vm)
          PYTHON

      # The ARM runners have 16 GB of memory; large Rust links need more.
      - name: Add swap
        if: inputs.systems != 'x86_64-linux'
        run: |
          set -euo pipefail
          sudo fallocate -l 24G /circus-swap
          sudo chmod 600 /circus-swap
          sudo mkswap /circus-swap
          sudo swapon /circus-swap
          swapon --show
          free -h

      - name: Set up Nix
        uses: ./.github/actions/nix-setup
        with:
          nix-conf: |
            ${{ env.nix-conf }}
            ${{ inputs.systems == 'x86_64-linux' && 'extra-system-features = kvm nixos-test' || '' }}
            ${{ inputs.systems == 'x86_64-linux' && 'extra-sandbox-paths = /dev/kvm' || '' }}
          s3-store: ${{ env.NIKS3_S3_STORE }}
          s3-access-key: ${{ secrets.NIKS3_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.NIKS3_S3_SECRET_KEY }}

      # The queue-runner (RPC) and its binary cache are reachable only over
      # NetBird or Tailscale (rofl-15 TCP 443/8443). One of them is enough:
      # a failing overlay must not stop the job, the wait below decides.
      - name: Tailscale Connect
        if: vars.TS_CIRCUS_CLIENT_ID != ''
        continue-on-error: true
        timeout-minutes: 4
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_CIRCUS_CLIENT_ID }}
          audience: ${{ vars.TS_CIRCUS_AUDIENCE }}
          tags: tag:circus-builder
          # Both overlays use 100.64.0.0/10: without its own netfilter rules,
          # Tailscale does not drop NetBird's replies.
          args: --netfilter-mode=off --accept-dns=false

      - name: Netbird Connect
        continue-on-error: true
        timeout-minutes: 4
        uses: Alemiz112/netbird-connect@master
        with:
          setup-key: ${{ secrets.NB_SETUP_KEY }}

      # An overlay reports "connected" before the route to rofl-15 is usable;
      # an agent dialing too early fails with "Network unreachable" and an
      # ephemeral session does not retry.
      - name: Wait for the queue-runner
        env:
          RUNNER_URL: ${{ inputs.runner_url }}
        run: |
          set -euo pipefail
          hostport="${RUNNER_URL#*://}"
          host="${hostport%:*}"
          port="${hostport##*:}"
          for _ in $(seq 1 90)
          do
            if timeout 2 bash -c "exec 3<>/dev/tcp/${host}/${port}" 2>/dev/null
            then
              echo "reached ${host}:${port}"
              exit 0
            fi
            sleep 2
          done
          echo "::error::${host}:${port} unreachable over NetBird and Tailscale"
          exit 1

      - name: Install x86_64 circus-agent
        if: inputs.systems == 'x86_64-linux'
        env:
          AGENT_FLAKE_REF: ${{ inputs.agent_binary_url }}
        run: |
          set -euo pipefail
          if [[ ! "$AGENT_FLAKE_REF" =~ ^github:pschmitt/circus/[0-9a-f]{40}#circus-agent$ ]]
          then
            echo "::error::expected a commit-pinned Circus agent flake package"
            exit 1
          fi
          # Use the same nixpkgs revision as the installed agents so this can
          # substitute the package from the shared Nix cache.
          nixpkgs_ref="$(jq -er '
            .nodes.root.inputs.nixpkgs as $input
            | .nodes[$input].locked
            | "github:\(.owner)/\(.repo)/\(.rev)"
          ' flake.lock)"
          nix build --no-write-lock-file --override-input nixpkgs "$nixpkgs_ref" \
            --out-link "$RUNNER_TEMP/circus-agent-package" "$AGENT_FLAKE_REF"
          ln -s "$RUNNER_TEMP/circus-agent-package/bin/circus-agent" "$RUNNER_TEMP/circus-agent"

      - name: Request OIDC token
        env:
          AUDIENCE: ${{ inputs.oidc_audience }}
        run: |
          set -euo pipefail
          response="$(
            curl -fsSL \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}"
          )"
          token="$(jq -r '.value' <<<"$response")"
          echo "::add-mask::$token"
          printf 'CIRCUS_AGENT_TOKEN=%s\n' "$token" >>"$GITHUB_ENV"

      - name: Download ARM circus-agent
        if: inputs.systems != 'x86_64-linux'
        env:
          AGENT_BINARY_URL: ${{ inputs.agent_binary_url }}
        # The queue-runner pins the binary with a "#sha256=<hex>" fragment
        # (services.circus.githubActionsAgents.agentBinarySha256).
        run: |
          set -euo pipefail
          expected="${AGENT_BINARY_URL##*#sha256=}"
          if [[ "$expected" == "$AGENT_BINARY_URL" || ! "$expected" =~ ^[0-9a-f]{64}$ ]]
          then
            echo "::error::agent_binary_url has no #sha256=<hex> fragment"
            exit 1
          fi
          curl -fsSL "${AGENT_BINARY_URL%%#*}" -o "$RUNNER_TEMP/circus-agent"
          echo "$expected  $RUNNER_TEMP/circus-agent" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/circus-agent"

      - name: Run circus-agent
        env:
          AGENT_NAME: ${{ inputs.agent_name }}
          RUNNER_URL: ${{ inputs.runner_url }}
          SYSTEMS: ${{ inputs.systems }}
          SUPPORTED_FEATURES: ${{ inputs.supported_features }}
          MANDATORY_FEATURES: ${{ inputs.mandatory_features }}
          MAX_JOBS: ${{ inputs.max_jobs }}
          CORES: ${{ inputs.cores }}
          SPEED_FACTOR: ${{ inputs.speed_factor }}
        run: |
          set -euo pipefail

          args=(
            --ephemeral
            --name "$AGENT_NAME"
            --runner-url "$RUNNER_URL"
            --max-jobs "$MAX_JOBS"
            --cores "$CORES"
            --speed-factor "$SPEED_FACTOR"
            --work-dir "$RUNNER_TEMP/circus-agent-work"
          )

          add_csv_args() {
            local flag="$1"
            local value="$2"
            local item
            local -a items

            [[ -z "$value" ]] && return 0
            IFS=',' read -ra items <<<"$value"
            for item in "${items[@]}"
            do
              item="${item//[[:space:]]/}"
              [[ -n "$item" ]] && args+=("$flag" "$item")
            done
          }

          add_csv_args --system "$SYSTEMS"
          add_csv_args --supported-feature "$SUPPORTED_FEATURES"
          add_csv_args --mandatory-feature "$MANDATORY_FEATURES"

          exec "$RUNNER_TEMP/circus-agent" "${args[@]}"
