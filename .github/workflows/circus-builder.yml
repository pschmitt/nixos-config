# Ephemeral aarch64 build agent for Circus CI (services/circus/README.md).
# Started only by the Circus queue-runner on rofl-15 (workflow_dispatch from
# its gha-aarch64-linux pool, off unless services.circus.githubActionsAgents
# is enabled). The agent authenticates with this run's GitHub OIDC token;
# Circus only gives it builds of trusted refs of this repository.
name: Circus Builder

on:
  workflow_dispatch:
    inputs:
      runner_url:
        required: true
        type: string
      oidc_audience:
        required: true
        type: string
      agent_binary_url:
        description: Pinned circus-agent binary matching the queue-runner
        required: true
        type: string
      systems:
        description: Comma-separated Nix systems
        required: true
        type: string
      supported_features:
        description: Comma-separated supported system features
        required: false
        type: string
        default: ""
      mandatory_features:
        description: Comma-separated mandatory system features
        required: false
        type: string
        default: ""
      max_jobs:
        required: true
        type: string
      cores:
        required: true
        type: string
      speed_factor:
        required: true
        type: string
      agent_name:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-agent:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # The queue-runner (RPC) and its binary cache are reachable only over
      # NetBird; the setup key's group needs a policy to rofl-15 TCP 443/8443.
      - name: Netbird Connect
        uses: Alemiz112/netbird-connect@master
        with:
          setup-key: ${{ secrets.NB_SETUP_KEY }}

      - name: Request OIDC token
        env:
          AUDIENCE: ${{ inputs.oidc_audience }}
        run: |
          set -euo pipefail
          response="$(
            curl -fsSL \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}"
          )"
          token="$(jq -r '.value' <<<"$response")"
          echo "::add-mask::$token"
          printf 'CIRCUS_AGENT_TOKEN=%s\n' "$token" >>"$GITHUB_ENV"

      - name: Download circus-agent
        env:
          AGENT_BINARY_URL: ${{ inputs.agent_binary_url }}
        run: |
          set -euo pipefail
          curl -fsSL "$AGENT_BINARY_URL" -o "$RUNNER_TEMP/circus-agent"
          chmod +x "$RUNNER_TEMP/circus-agent"

      - name: Run circus-agent
        env:
          AGENT_NAME: ${{ inputs.agent_name }}
          RUNNER_URL: ${{ inputs.runner_url }}
          SYSTEMS: ${{ inputs.systems }}
          SUPPORTED_FEATURES: ${{ inputs.supported_features }}
          MANDATORY_FEATURES: ${{ inputs.mandatory_features }}
          MAX_JOBS: ${{ inputs.max_jobs }}
          CORES: ${{ inputs.cores }}
          SPEED_FACTOR: ${{ inputs.speed_factor }}
        run: |
          set -euo pipefail

          args=(
            --ephemeral
            --name "$AGENT_NAME"
            --runner-url "$RUNNER_URL"
            --max-jobs "$MAX_JOBS"
            --cores "$CORES"
            --speed-factor "$SPEED_FACTOR"
            --work-dir "$RUNNER_TEMP/circus-agent-work"
          )

          add_csv_args() {
            local flag="$1"
            local value="$2"
            local item
            local -a items

            [[ -z "$value" ]] && return 0
            IFS=',' read -ra items <<<"$value"
            for item in "${items[@]}"
            do
              item="${item//[[:space:]]/}"
              [[ -n "$item" ]] && args+=("$flag" "$item")
            done
          }

          add_csv_args --system "$SYSTEMS"
          add_csv_args --supported-feature "$SUPPORTED_FEATURES"
          add_csv_args --mandatory-feature "$MANDATORY_FEATURES"

          exec "$RUNNER_TEMP/circus-agent" "${args[@]}"
