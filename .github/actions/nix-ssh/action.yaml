name: Set up authenticated Nix stores
description: Prepare the shared SSH identity, known hosts and connection keepalives
inputs:
  private-key:
    description: Existing CI SSH identity
    required: true
  hosts:
    description: Space-separated cache and builder hosts
    required: true
runs:
  using: composite
  steps:
    - name: Prepare SSH
      shell: bash
      env:
        SSH_PRIVATE_KEY: ${{ inputs.private-key }}
        SSH_HOSTS: ${{ inputs.hosts }}
      run: bash "$GITHUB_ACTION_PATH/setup.sh"
